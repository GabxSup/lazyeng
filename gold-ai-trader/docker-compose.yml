services:
  aurum:
    build:
      context: .
      dockerfile: Dockerfile
    image: aurum-ai:latest
    container_name: aurum-ai
    init: true
    env_file:
      - .env
    environment:
      AURUM_HOST: 0.0.0.0
      AURUM_PORT: "8080"
      AURUM_DATA_DIR: /data
    ports:
      - "${AURUM_PORT:-8080}:8080"
      # MQL4 WebRequest only supports http on port 80 (not arbitrary ports).
      # Keep the EA path loopback-only.
      - "127.0.0.1:80:8080"
    volumes:
      - aurum-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aurum-data:
    name: aurum-data
